version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: cv-optimizer-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # ─── Core ───
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata

      # ─── Auth (change these!) ───
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_USER_MANAGEMENT_DISABLED=true

      # ─── AI ───
      - GROQ_API_KEY=${GROQ_API_KEY:-}

      # ─── Execution ───
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_METRICS=true
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: cv-optimizer-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama

volumes:
  n8n_data:
    driver: local
  ollama_data:
    driver: local
